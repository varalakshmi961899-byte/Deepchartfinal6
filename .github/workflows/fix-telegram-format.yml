name: Fix Telegram alert formatting

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-telegram-format:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Fix Telegram alert formatting')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Telegram formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/services/TelegramService.ts')
          s = p.read_text()

          old = '''    const text = [
      `${emoji} <b>TRENDLINE ALERT — ${condLabel.toUpperCase()}</b>`,
      ``,
      `📊 <b>Symbol:</b> ${opts.symbol}`,
      `⏱ <b>Timeframe:</b> ${opts.timeframe}`,
      `📐 <b>Line Price:</b> $${opts.projectedPrice.toFixed(5)}`,
      `💹 <b>Triggered at:</b> $${opts.triggeredPrice.toFixed(5)}`,
      `📍 <b>Event:</b> ${this.trendlineEventText(opts.condition, opts.direction)}`,
      opts.notes ? `📝 <b>Notes:</b> ${opts.notes}` : null,
      ``,
      `⏰ ${new Date().toUTCString()}`,
    ].filter(Boolean).join("\\n");'''
          new = '''    const text = [
      `${emoji} <b>TRENDLINE ALERT — ${condLabel.toUpperCase()}</b>`,
      ``,
      `<b>Symbol:</b> ${opts.symbol}`,
      `<b>Timeframe:</b> ${opts.timeframe}`,
      `<b>Line Price:</b> ${opts.projectedPrice.toFixed(5)}`,
      `<b>Triggered Price:</b> ${opts.triggeredPrice.toFixed(5)}`,
      `<b>Event:</b> ${this.trendlineEventText(opts.condition, opts.direction)}`,
      opts.notes ? `<b>Notes:</b> ${opts.notes}` : null,
      ``,
      `<b>Time:</b> ${new Date().toUTCString()}`,
    ].filter(Boolean).join("\\n");'''
          if old not in s:
              raise SystemExit('Expected trendline formatter block not found')
          s = s.replace(old, new, 1)

          old2 = '''    const text = [
      `${emoji} <b>ZONE ALERT — ${condLabel.toUpperCase()}</b>`,
      ``,
      `📊 <b>Symbol:</b> ${opts.symbol}`,
      `🗂 <b>Zone:</b> ${zoneLabel}`,
      `📏 <b>Range:</b> $${opts.lowerPrice.toFixed(5)} – $${opts.upperPrice.toFixed(5)}`,
      `💹 <b>Price:</b> $${opts.triggeredPrice.toFixed(5)}`,
      `📍 <b>Event:</b> ${eventText[opts.direction] ?? opts.direction}`,
      opts.notes ? `📝 <b>Notes:</b> ${opts.notes}` : null,
      ``,
      `⏰ ${new Date().toUTCString()}`,
    ].filter(Boolean).join("\\n");'''
          new2 = '''    const text = [
      `${emoji} <b>ZONE ALERT — ${condLabel.toUpperCase()}</b>`,
      ``,
      `<b>Symbol:</b> ${opts.symbol}`,
      `<b>Zone:</b> ${zoneLabel}`,
      `<b>Range:</b> ${opts.lowerPrice.toFixed(5)} – ${opts.upperPrice.toFixed(5)}`,
      `<b>Price:</b> ${opts.triggeredPrice.toFixed(5)}`,
      `<b>Event:</b> ${eventText[opts.direction] ?? opts.direction}`,
      opts.notes ? `<b>Notes:</b> ${opts.notes}` : null,
      ``,
      `<b>Time:</b> ${new Date().toUTCString()}`,
    ].filter(Boolean).join("\\n");'''
          if old2 not in s:
              raise SystemExit('Expected zone formatter block not found')
          s = s.replace(old2, new2, 1)

          old3 = '''    const lines = [
      `🔔 <b>REMINDER ${opts.reminderNumber}${total} — ${title}</b>`,
      ``,
      `📊 <b>Symbol:</b> ${opts.symbol}`,
      `🎯 <b>Condition:</b> ${conditionLabel[opts.condition] ?? opts.condition.replace(/_/g, " ")}`,
    ];'''
          new3 = '''    const lines = [
      `🔔 <b>REMINDER ${opts.reminderNumber}${total} — ${title}</b>`,
      ``,
      `<b>Symbol:</b> ${opts.symbol}`,
      `<b>Condition:</b> ${conditionLabel[opts.condition] ?? opts.condition.replace(/_/g, " ")}`,
    ];'''
          if old3 not in s:
              raise SystemExit('Expected reminder header block not found')
          s = s.replace(old3, new3, 1)
          s = s.replace('lines.push(`🎯 <b>Target:</b> $${opts.targetPrice}`);', 'lines.push(`<b>Target:</b> ${opts.targetPrice}`);', 1)
          s = s.replace('if (opts.zoneType) lines.push(`🗂 <b>Zone:</b> ${opts.zoneType.replace(/_/g, " ")}`);', 'if (opts.zoneType) lines.push(`<b>Zone:</b> ${opts.zoneType.replace(/_/g, " ")}`);', 1)
          s = s.replace('lines.push(`📏 <b>Range:</b> ${opts.lowerPrice} – ${opts.upperPrice}`);', 'lines.push(`<b>Range:</b> ${opts.lowerPrice} – ${opts.upperPrice}`);', 1)
          s = s.replace('lines.push(`📐 <b>Drawing:</b> ${opts.drawingType.replace(/_/g, " ")}`);', 'lines.push(`<b>Drawing:</b> ${opts.drawingType.replace(/_/g, " ")}`);', 1)
          s = s.replace('lines.push(`💹 <b>Triggered at:</b> $${opts.triggeredPrice}`);', 'lines.push(`<b>Triggered Price:</b> ${opts.triggeredPrice}`);', 1)
          s = s.replace('if (opts.message) lines.push(`📝 <b>Note:</b> ${opts.message}`);', 'if (opts.message) lines.push(`<b>Note:</b> ${opts.message}`);', 1)
          s = s.replace('lines.push(``, `⏰ ${new Date().toUTCString()}`);', 'lines.push(``, `<b>Time:</b> ${new Date().toUTCString()}`);', 1)

          old4 = '''    const text = [
      `${meta.emoji} <b>PRICE ALERT — ${meta.title.toUpperCase()}</b>`,
      ``,
      `📊 <b>Symbol:</b> ${opts.symbol}`,
      `🎯 <b>${meta.valueLabel}:</b> ${target}`,
      `💹 <b>Triggered at:</b> $${opts.triggeredPrice.toFixed(5)}`,
      opts.message ? `📝 <b>Note:</b> ${opts.message}` : null,
      ``,
      `⏰ ${new Date().toUTCString()}`,
    ].filter(Boolean).join("\\n");'''
          new4 = '''    const text = [
      `${meta.emoji} <b>PRICE ALERT — ${meta.title.toUpperCase()}</b>`,
      ``,
      `<b>Symbol:</b> ${opts.symbol}`,
      `<b>${meta.valueLabel}:</b> ${target}`,
      `<b>Triggered Price:</b> ${opts.triggeredPrice.toFixed(5)}`,
      opts.message ? `<b>Note:</b> ${opts.message}` : null,
      ``,
      `<b>Time:</b> ${new Date().toUTCString()}`,
    ].filter(Boolean).join("\\n");'''
          if old4 not in s:
              raise SystemExit('Expected price formatter block not found')
          s = s.replace(old4, new4, 1)

          old5 = '''    const text = [
      `🔔 <b>${dtLabel.toUpperCase()} ALERT — ${opts.conditionLabel.toUpperCase()}</b>`,
      ``,
      `${emoji} <b>Symbol:</b> ${opts.symbol}`,
      `⚡ <b>Condition:</b> ${opts.conditionLabel}`,
      `📐 <b>Line Price:</b> ${opts.projectedPrice.toFixed(5)}`,
      `💹 <b>Triggered at:</b> ${opts.triggeredPrice.toFixed(5)}`,
      `⏱ <b>Timeframe:</b> ${opts.timeframe}`,
      `📍 <b>Event:</b> ${this.trendlineEventText(opts.condition, opts.direction)}`,
      opts.notes ? `📝 <b>Notes:</b> ${opts.notes}` : null,
      ``,
      `⏰ ${new Date().toUTCString()}`,
    ].filter(Boolean).join("\\n");'''
          new5 = '''    const text = [
      `🔔 <b>${dtLabel.toUpperCase()} ALERT — ${opts.conditionLabel.toUpperCase()}</b>`,
      ``,
      `<b>Symbol:</b> ${opts.symbol}`,
      `<b>Condition:</b> ${opts.conditionLabel}`,
      `<b>Line Price:</b> ${opts.projectedPrice.toFixed(5)}`,
      `<b>Triggered Price:</b> ${opts.triggeredPrice.toFixed(5)}`,
      `<b>Timeframe:</b> ${opts.timeframe}`,
      `<b>Event:</b> ${this.trendlineEventText(opts.condition, opts.direction)}`,
      opts.notes ? `<b>Notes:</b> ${opts.notes}` : null,
      ``,
      `<b>Time:</b> ${new Date().toUTCString()}`,
    ].filter(Boolean).join("\\n");'''
          if old5 not in s:
              raise SystemExit('Expected drawing formatter block not found')
          s = s.replace(old5, new5, 1)

          p.write_text(s)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/services/TelegramService.ts
          git commit -m "Fix Telegram alert formatting"
          git push
